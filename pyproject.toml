[project]
name = "phishing-attack-defender"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-Cors>=4.0,<5.0",
    "requests>=2.31,<3.0",
    "python-whois>=0.9,<1.0",
    "gunicorn>=22.0,<23.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
]

# Some VerceI/uv workflows expect a top-level [project] table.
# Keep this file TOML-valid and avoid accidental formatting issues.

[tool.vercel]
entrypoint = "backend.app:app"

